[project]
name = "aai3001-cvdl"
version = "0.1.0"
description = "AAI3001 Computer Vision and Deep Learning coursework"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14",
    "torchvision>=0.29",
    "numpy>=2.3.5",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

# Linux and Windows get the CUDA 13.0 build. macOS has no CUDA build and gets
# the default PyPI build, which supports Apple GPUs (MPS).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
